<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TigerGate Platform — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .login-gradient { background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #6D28D9 100%); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.5s ease-out; }
  </style>
</head>
<body class="login-gradient min-h-screen flex items-center justify-center p-4">

  <!-- Floating decoration -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-white/5 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-white/5 rounded-full blur-3xl"></div>
  </div>

  <div class="w-full max-w-md animate-fade-in relative z-10">
    <!-- Logo Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <!-- Logo -->
      <div class="flex flex-col items-center mb-8">
        <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-indigo-500/30">
          <svg class="w-9 h-9 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">TigerGate Platform</h1>
        <p class="text-sm text-gray-500 mt-1">Sign in to your account</p>
      </div>

      <!-- Error Message -->
      <div id="error-box" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg flex items-center gap-2">
        <svg class="w-5 h-5 text-red-500 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
        <span id="error-text" class="text-sm text-red-600 font-medium"></span>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-5">
        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="10" cy="7" r="3.5"/>
                <path d="M3 18c0-3.5 3-6 7-6s7 2.5 7 6"/>
              </svg>
            </div>
            <input type="text" id="username" name="username" required autocomplete="username"
              class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
              placeholder="Enter your username">
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="4" y="9" width="12" height="8" rx="2"/>
                <path d="M7 9V6a3 3 0 016 0v3"/>
              </svg>
            </div>
            <input type="password" id="password" name="password" required autocomplete="current-password"
              class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
              placeholder="Enter your password">
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" id="login-btn"
          class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm transition-colors duration-150 focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 flex items-center justify-center gap-2">
          <span id="btn-text">Sign In</span>
          <svg id="btn-spinner" class="hidden w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
        </button>
      </form>

      <!-- Demo hint -->
      <p class="text-center text-xs text-gray-400 mt-6">Demo: admin / admin123</p>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-white/60 mt-6">&copy; 2024 TigerGate Security &mdash; Internal Use Only</p>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('tg_token')) {
      window.location.href = '/app';
    }

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const loginBtn = document.getElementById('login-btn');

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      btnText.textContent = loading ? 'Signing in…' : 'Sign In';
      btnSpinner.classList.toggle('hidden', !loading);
      loginBtn.classList.toggle('opacity-70', loading);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      setLoading(true);

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Invalid credentials');
          setLoading(false);
          return;
        }

        localStorage.setItem('tg_token', data.token);
        localStorage.setItem('tg_user', JSON.stringify(data.user));
        window.location.href = '/app';
      } catch (err) {
        showError('Network error. Please try again.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
