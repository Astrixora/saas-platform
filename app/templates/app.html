<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TigerGate Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-gray-50 font-['Inter']">
  <div id="app" class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-gray-900 text-white flex flex-col flex-shrink-0">
      <!-- Logo -->
      <div class="h-16 flex items-center gap-3 px-5 border-b border-white/10">
        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <span class="font-bold text-sm tracking-tight">TigerGate</span>
      </div>

      <!-- Navigation -->
      <nav id="nav" class="flex-1 px-3 py-4 space-y-1 overflow-y-auto"></nav>

      <!-- User info -->
      <div id="sidebar-user" class="px-4 py-4 border-t border-white/10"></div>
    </aside>

    <!-- Main area -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <header id="header" class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 flex-shrink-0">
        <h2 id="page-title" class="text-lg font-semibold text-gray-900">Dashboard</h2>
        <div class="flex items-center gap-4">
          <button class="relative p-2 text-gray-400 hover:text-gray-600 rounded-lg hover:bg-gray-100 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M10 2a5 5 0 00-5 5v3l-1.5 2.5a.5.5 0 00.4.75h12.2a.5.5 0 00.4-.75L15 10V7a5 5 0 00-5-5z"/>
              <path d="M8 15a2 2 0 004 0"/>
            </svg>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <div id="header-user" class="flex items-center gap-2 cursor-pointer"></div>
        </div>
      </header>

      <!-- Content -->
      <main id="content" class="flex-1 overflow-y-auto p-6"></main>
    </div>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
    <div id="modal-content" class="bg-white rounded-xl shadow-2xl max-w-lg w-full mx-4 modal-enter"></div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="fixed top-4 right-4 z-[60] flex flex-col gap-2"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
